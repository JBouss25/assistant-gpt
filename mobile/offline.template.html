<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mentora — Hors ligne</title>
    <style>
      :root { color-scheme: light dark; --bg: #fbfaf4; --fg: #3a2f22; --muted: #7a6c5a; --brand: #67783a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1c1a15; --fg: #f3f1ea; --muted: #b5ab98; --brand: #9fb15f; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; text-align: center; }
      .logo { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 24px;
        background: linear-gradient(135deg, #67783a, #7a5638); display: grid; place-items: center; }
      .dots { display: flex; gap: 0; } .dots span { width: 18px; height: 18px; border-radius: 50%; background: #fff; }
      .dots span + span { opacity: .6; margin-left: -2px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 auto 24px; max-width: 280px; line-height: 1.5; }
      button { border: 0; border-radius: 999px; padding: 12px 24px; font-size: 16px; font-weight: 600;
        background: var(--brand); color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo"><div class="dots"><span></span><span></span></div></div>
      <h1>Pas de connexion</h1>
      <p>Mentora a besoin d'Internet pour afficher vos enseignants, messages et cours.</p>
      <button onclick="retry()">Réessayer</button>
    </main>
    <script>
      // URL injectée par scripts/mobile-sync.mjs
      function retry() { location.replace("__APP_URL__"); }
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
